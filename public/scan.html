<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b4f">
<title>Scanner tiket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--ink); color: #fff; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top)); }
  header h1 { color: #fff; font-size: 20px; font-weight: 900; flex: 1; }
  header h1 span { color: #7fe3d6; }
  header a { color: #cfe6ec; font-size: 14px; font-weight: 700; text-decoration: none; }
  .count { background: var(--ink-2); padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; color: #cfe6ec; }
  .count b { color: #7fe3d6; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
  #reader { width: 100%; border-radius: 24px; overflow: hidden; background: #0a2f3f; aspect-ratio: 1 / 1; border: 3px solid var(--primary); }
  #reader video { object-fit: cover; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row select, .row input { background: var(--ink-2); border-color: #23677f; color: #fff; }
  .row input::placeholder { color: #8fb3bf; text-transform: none; letter-spacing: 0; }
  #code { text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
  #code::placeholder { font-weight: 500; }
  .hint { color: #a9c7d1; font-size: 13.5px; text-align: center; margin: 12px 0 0; }
  .camErr { background: #3a2230; border: 1px solid #6a3045; color: #f3c6c6; padding: 16px; border-radius: 16px; font-size: 14px; margin-top: 14px; }

  /* hasil scan */
  .result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px; z-index: 50; cursor: pointer; }
  .result.ok { background: var(--ok); }
  .result.used { background: var(--warn); }
  .result.invalid { background: var(--bad); }
  .result .icon { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .result .icon svg { width: 60px; height: 60px; }
  .result h2 { color: #fff; font-size: 38px; font-weight: 800; margin-bottom: 8px; }
  .result .name { font-size: 22px; font-weight: 600; }
  .result .info { font-size: 15px; opacity: 0.92; margin-top: 6px; }
  .result .tap { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); font-size: 13px; opacity: 0.8; }
</style>
</head>
<body>
<header>
  <h1>Scanner <span>tiket</span></h1>
  <span class="count">Discan: <b id="n">0</b></span>
  <a href="/panitia">← Menu</a>
</header>

<main>
  <div id="reader"></div>
  <div id="camErr" class="camErr hidden"></div>
  <div class="row"><select id="cams" aria-label="Pilih kamera"></select></div>
  <form class="row" id="manual">
    <input id="code" type="text" placeholder="Ketik kode cadangan" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn gold" type="submit">Cek</button>
  </form>
  <p class="hint">Arahkan kamera ke QR tiket, hasil muncul otomatis. Kalau QR nggak kebaca, ketik kode cadangan yang ada di bawah QR peserta.</p>
</main>

<div id="result" class="result hidden" role="alert">
  <div class="icon" id="rIcon"></div>
  <h2 id="rTitle"></h2>
  <div class="name" id="rName"></div>
  <div class="info" id="rInfo"></div>
  <div class="tap">Ketuk untuk scan berikutnya</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ICONS = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  used: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17.5v.01"/></svg>',
  invalid: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
};
const TITLES = { ok: "Tiket valid", used: "Sudah dipakai", invalid: "Tiket tidak valid" };

let scanner, busy = false, count = 0, hideTimer, audio;

function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = ok ? 880 : 220; o.type = ok ? "sine" : "square";
    g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + (ok ? 0.15 : 0.4));
  } catch {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 80, 120]);
}

async function check(code) {
  if (busy) return;
  busy = true;
  try { scanner && scanner.getState() === 2 && scanner.pause(true); } catch {}
  let d;
  try {
    const r = await fetch("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    if (r.status === 401) { location.href = "/admin?next=scan"; return; }
    d = await r.json();
  } catch {
    d = { status: "invalid", message: "Gagal terhubung ke server. Cek internet." };
  }
  show(d);
}

function show(d) {
  const p = d.participant || {};
  $("result").className = "result " + d.status;
  $("rIcon").innerHTML = ICONS[d.status];
  $("rTitle").textContent = TITLES[d.status];
  $("rName").textContent = p.name || "";
  $("rInfo").textContent =
    d.status === "used" ? `Masuk pada ${p.scannedAt}${p.scannedBy ? " oleh " + p.scannedBy : ""}`
    : d.status === "ok" ? [p.institution, "Silakan masuk"].filter(Boolean).join(" · ")
    : d.message;
  beep(d.status === "ok");
  if (d.status === "ok") $("n").textContent = ++count;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hide, d.status === "ok" ? 2200 : 4500);
}

function hide() {
  clearTimeout(hideTimer);
  $("result").className = "result hidden";
  $("code").value = "";
  try { scanner && scanner.getState() === 3 && scanner.resume(); } catch {}
  setTimeout(() => (busy = false), 400);
}
$("result").addEventListener("click", hide);

$("manual").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("code").value.trim();
  if (v) check(v);
});

async function start(camId) {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch {}
  scanner = scanner || new Html5Qrcode("reader", { verbose: false });
  const box = (w, h) => { const s = Math.floor(Math.min(w, h) * 0.72); return { width: s, height: s }; };
  await scanner.start(camId, { fps: 12, qrbox: box, aspectRatio: 1 }, (text) => check(text), () => {});
  localStorage.setItem("cam", camId);
}

async function init() {
  const me = await fetch("/api/me").then(r => r.json());
  if (!me.user) { location.href = "/admin?next=scan"; return; }
  try {
    const cams = await Html5Qrcode.getCameras();
    if (!cams.length) throw new Error("Tidak ada kamera yang terdeteksi.");
    $("cams").innerHTML = cams.map((c, i) => `<option value="${c.id}">${c.label || "Kamera " + (i + 1)}</option>`).join("");
    const saved = localStorage.getItem("cam");
    const back = cams.find(c => /back|rear|belakang|environment/i.test(c.label));
    const pick = (cams.find(c => c.id === saved) || back || cams[cams.length - 1]).id;
    $("cams").value = pick;
    if (cams.length < 2) $("cams").parentElement.classList.add("hidden");
    await start(pick);
  } catch (e) {
    const insecure = !window.isSecureContext;
    $("camErr").innerHTML = insecure
      ? "Kamera hanya bisa dipakai lewat <b>https://</b> (atau localhost). Buka halaman ini lewat alamat https."
      : "Kamera tidak bisa dibuka. Pastikan izin kamera untuk situs ini diizinkan di pengaturan browser, lalu muat ulang halaman.<br><small>" + (e.message || e) + "</small>";
    $("camErr").classList.remove("hidden");
    $("cams").parentElement.classList.add("hidden");
  }
}
$("cams").addEventListener("change", (e) => start(e.target.value));

init();
</script>
</body>
</html>
