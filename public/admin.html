<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* Login */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--ink); }
  .login .box { background: #fff; border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 380px; }
  .login h1 { font-size: 22px; margin-bottom: 4px; }
  .login p { margin: 0 0 22px; }

  /* Dashboard */
  header.top { background: var(--ink); color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header.top h1 { color: #fff; font-size: 18px; flex: 1; min-width: 180px; }
  header.top .who { color: #c9cddb; font-size: 13px; }
  header.top .btn.ghost { color: #fff; border-color: #3a4766; }
  .container { max-width: 1180px; margin: 0 auto; padding: 24px; }

  .stats { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 14px; margin-bottom: 22px; }
  .stat { background: #fff; border-radius: var(--radius); padding: 18px 20px; }
  .stat .n { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .stat .n small { font-size: 16px; font-weight: 500; color: var(--mute); }
  .stat .l { font-size: 13px; color: var(--mute); }
  .bar { height: 8px; background: var(--paper); border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width 0.4s; }
  .stat.in .n { color: var(--ok); }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .tools input { flex: 1; min-width: 200px; }
  .tools select { width: auto; }
  .seg { display: inline-flex; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 13px; font-size: 14px; border-radius: 7px; cursor: pointer; color: var(--mute); font-weight: 500; }
  .seg button.on { background: var(--ink); color: #fff; }

  .tablewrap { background: #fff; border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--mute); font-size: 12.5px; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--paper); vertical-align: middle; }
  td .nm { font-weight: 500; color: var(--ink); }
  td .sm { font-size: 12.5px; color: var(--mute); }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .pill.yes { background: #e3f5ea; color: #17733f; }
  .pill.no { background: var(--paper); color: var(--mute); }
  .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .empty { padding: 40px; text-align: center; color: var(--mute); }
  .danger { color: var(--bad) !important; }

  @media (max-width: 760px) {
    .container { padding: 16px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stats .stat:first-child { grid-column: 1 / -1; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    td { padding: 2px 0; border: 0; }
    td.hide-m { display: none; }
    .acts { justify-content: flex-start; margin-top: 8px; }
  }
</style>
</head>
<body>

<section id="loginView" class="login hidden">
  <div class="box">
    <h1>Masuk panitia</h1>
    <p class="mute">Untuk admin dan petugas scanner.</p>
    <div id="loginErr" class="alert err hidden"></div>
    <form id="loginForm">
      <div class="field"><label for="u">Username</label><input id="u" type="text" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn gold block" type="submit">Masuk</button>
    </form>
  </div>
</section>

<section id="dashView" class="hidden">
  <header class="top">
    <h1 id="evName">Dashboard</h1>
    <span class="who" id="who"></span>
    <a class="btn gold small" href="/scan">Buka scanner</a>
    <button class="btn ghost small" id="logout">Keluar</button>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat"><div class="n"><span id="sTotal">0</span> <small>/ <span id="sQuota">0</span></small></div><div class="l">Peserta terdaftar</div><div class="bar"><i id="sBar" style="width:0"></i></div></div>
      <div class="stat in"><div class="n" id="sIn">0</div><div class="l">Sudah masuk</div></div>
      <div class="stat"><div class="n" id="sOut">0</div><div class="l">Belum datang</div></div>
    </div>

    <div class="tools">
      <input type="search" id="search" placeholder="Cari nama, email, no. HP, atau no. tiket">
      <div class="seg" id="filter">
        <button data-f="all" class="on">Semua</button><button data-f="in">Sudah masuk</button><button data-f="out">Belum</button>
      </div>
      <a class="btn ghost small" href="/api/export.xlsx">Export Excel</a>
      <button class="btn ghost small danger" id="resetAll">Reset semua status</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Peserta</th><th>Kontak</th><th>No. tiket</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">Belum ada peserta.</div>
    </div>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let all = [], filter = "all", timer;

async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("401"); }
  return r.json();
}

function showLogin() {
  clearInterval(timer);
  $("dashView").classList.add("hidden"); $("loginView").classList.remove("hidden");
}
async function showDash(user) {
  $("loginView").classList.add("hidden"); $("dashView").classList.remove("hidden");
  $("who").textContent = "Login sebagai " + user;
  const ev = await fetch("/api/event").then(r => r.json());
  $("evName").textContent = ev.name; document.title = "Admin · " + ev.name;
  await load();
  clearInterval(timer); timer = setInterval(load, 8000);
}

async function load() {
  const d = await api("/api/participants");
  all = d.rows;
  $("sTotal").textContent = d.total; $("sQuota").textContent = d.quota;
  $("sIn").textContent = d.scanned; $("sOut").textContent = d.total - d.scanned;
  $("sBar").style.width = Math.min(100, (d.total / d.quota) * 100) + "%";
  render();
}

function render() {
  const s = $("search").value.trim().toLowerCase();
  const list = all.filter(p => {
    if (filter === "in" && !p.scannedAt) return false;
    if (filter === "out" && p.scannedAt) return false;
    if (!s) return true;
    return [p.name, p.email, p.phone, p.institution, p.id.slice(0, 6)].join(" ").toLowerCase().includes(s);
  });
  $("empty").classList.toggle("hidden", list.length > 0);
  $("empty").textContent = all.length ? "Tidak ada yang cocok." : "Belum ada peserta.";
  $("rows").innerHTML = list.map(p => `
    <tr>
      <td><div class="nm">${esc(p.name)}</div><div class="sm">${esc(p.institution || "")}</div></td>
      <td><div>${esc(p.email)}</div><div class="sm">${esc(p.phone)}</div></td>
      <td class="hide-m"><b>${esc(p.id.slice(0, 6).toUpperCase())}</b><div class="sm">daftar ${esc(p.createdAt)}</div></td>
      <td>${p.scannedAt
        ? `<span class="pill yes">Sudah masuk</span><div class="sm">${esc(p.scannedAt)} · ${esc(p.scannedBy || "")}</div>`
        : `<span class="pill no">Belum discan</span>`}</td>
      <td><div class="acts">
        ${p.scannedAt
          ? `<button class="btn ghost small" data-act="reset" data-id="${p.id}">Jadikan belum</button>`
          : `<button class="btn ghost small" data-act="in" data-id="${p.id}">Tandai masuk</button>`}
        <a class="btn ghost small" href="/tiket#${encodeURIComponent(p.code)}" target="_blank" rel="noopener">Tiket</a>
        <button class="btn ghost small danger" data-act="del" data-id="${p.id}" data-name="${esc(p.name)}">Hapus</button>
      </div></td>
    </tr>`).join("");
}

$("rows").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.dataset.id;
  b.disabled = true;
  if (b.dataset.act === "del") {
    if (!confirm(`Hapus ${b.dataset.name}? Tiketnya tidak bisa dipakai lagi.`)) { b.disabled = false; return; }
    await api("/api/participants/" + id, { method: "DELETE" });
  } else {
    await api(`/api/participants/${id}/status`, { method: "POST", body: JSON.stringify({ scanned: b.dataset.act === "in" }) });
  }
  load();
});

$("resetAll").addEventListener("click", async () => {
  if (!confirm("Semua tiket akan kembali berstatus 'belum discan'. Biasanya dipakai setelah uji coba. Lanjutkan?")) return;
  const d = await api("/api/participants/reset-all", { method: "POST" });
  alert(d.reset + " tiket direset.");
  load();
});

$("search").addEventListener("input", render);
$("filter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...$("filter").children].forEach(x => x.classList.toggle("on", x === b));
  render();
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").classList.add("hidden");
  const r = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("u").value, password: $("p").value }),
  });
  const d = await r.json();
  if (!r.ok) { $("loginErr").textContent = d.error; $("loginErr").classList.remove("hidden"); return; }
  const next = new URLSearchParams(location.search).get("next");
  if (next === "scan") location.href = "/scan"; else showDash(d.user);
});

$("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST" }); showLogin(); });

fetch("/api/me").then(r => r.json()).then(d => d.user ? showDash(d.user) : showLogin());
</script>
</body>
</html>
