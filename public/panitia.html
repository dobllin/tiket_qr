<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14b8a6">
<title>Menu panitia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; background: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.16) 0 140px, transparent 141px), linear-gradient(150deg, #19c3b1 0%, #12a6a6 45%, #2b8fd6 100%); }
  main { max-width: 760px; margin: 0 auto; padding: 44px 20px 56px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .top .chip { background: rgba(255,255,255,0.22); color: #fff; }
  .top .who { color: #fff; font-weight: 700; font-size: 14px; flex: 1; }
  h1 { color: #fff; font-size: clamp(32px, 6vw, 48px); font-weight: 900; margin-bottom: 6px; }
  .sub { color: #e6fbf8; font-weight: 600; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink);
    background: #fff; border-radius: 24px; padding: 22px 20px; box-shadow: var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s; }
  .item:hover { transform: translateY(-3px); box-shadow: 0 22px 44px -18px rgba(13, 59, 79, 0.45); }
  .item:active { transform: translateY(1px); }
  .item:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .item .ic { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--primary-d); }
  .item .ic svg { width: 28px; height: 28px; }
  .item b { font-family: "Nunito", sans-serif; font-size: 22px; font-weight: 900; line-height: 1.1; }
  .item span { font-size: 13.5px; color: var(--mute); font-weight: 500; }
  .item.dash .ic { background: var(--mint); }
  .item.scan .ic { background: #fde8ee; color: #c2416a; }
  .item.reg .ic { background: var(--sky); color: var(--blue); }
  .stats { margin-top: 22px; background: rgba(255,255,255,0.18); color: #fff; border-radius: 20px; padding: 14px 20px;
    display: flex; gap: 22px; flex-wrap: wrap; font-weight: 700; font-size: 14px; backdrop-filter: blur(6px); }
  .stats b { color: #fff; font-size: 20px; font-family: "Nunito", sans-serif; font-weight: 900; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } .item { flex-direction: row; align-items: center; } .item .ic { flex: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="chip">🦷 Panitia</span>
    <span class="who" id="who"></span>
    <button class="btn ghost small" id="logout">Keluar</button>
  </div>
  <h1>Mau ngapain hari ini?</h1>
  <p class="sub" id="evName">&nbsp;</p>

  <div class="grid">
    <a class="item dash" href="/admin">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
      <div><b>Dashboard</b><br><span>Lihat peserta, ubah status, export Excel</span></div>
    </a>
    <a class="item scan" href="/scan">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></div>
      <div><b>Scanner</b><br><span>Scan tiket peserta di pintu masuk</span></div>
    </a>
    <a class="item reg" href="/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"/><path d="M9 12h6M9 16h4"/></svg></div>
      <div><b>Pendaftaran</b><br><span>Halaman yang dibuka peserta</span></div>
    </a>
  </div>

  <div class="stats" id="stats"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
async function init() {
  const me = await fetch("/api/me").then(r => r.json());
  if (!me.user) { location.href = "/admin?next=panitia"; return; }
  $("who").textContent = "Hai, " + me.user + " 👋";
  const ev = await fetch("/api/event").then(r => r.json());
  $("evName").textContent = ev.name;
  document.title = "Panitia · " + ev.name;
  const d = await fetch("/api/participants").then(r => r.json());
  $("stats").innerHTML = `<span>Terdaftar <b>${d.total}</b> / ${d.quota}</span><span>Sudah masuk <b>${d.scanned}</b></span><span>Belum datang <b>${d.total - d.scanned}</b></span>`;
}
$("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/"; });
init();
</script>
</body>
</html>
