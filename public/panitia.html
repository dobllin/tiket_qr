<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171c2f">
<title>Menu panitia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; background: radial-gradient(ellipse at 100% 0%, rgba(104,120,153,0.5), transparent 50%), linear-gradient(165deg, #26324c, #171c2f 70%); }
  main { max-width: 780px; margin: 0 auto; padding: 36px 20px 56px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .top .chip { background: var(--peach); border-color: var(--peach); }
  .top .who { color: #fff; font-family: var(--f-mono); font-weight: 700; font-size: 13px; flex: 1; }
  h1 { color: #fff; font-size: clamp(34px, 6.4vw, 56px); margin-bottom: 8px; text-shadow: 3px 3px 0 var(--red); }
  .sub { color: var(--peach); font-family: var(--f-mono); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: var(--ink);
    background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 20px 18px; box-shadow: 6px 6px 0 #0d1020;
    transition: transform 0.1s, box-shadow 0.1s; }
  .item:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--red); }
  .item:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #0d1020; }
  .item:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  .item .ic { width: 50px; height: 50px; border-radius: 10px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; color: #fff; }
  .item .ic svg { width: 26px; height: 26px; }
  .item b { font-family: var(--f-head); font-size: 24px; font-weight: 700; line-height: 1.05; text-transform: uppercase; }
  .item span { font-size: 13.5px; color: var(--mute); font-weight: 500; }
  .item.dash .ic { background: var(--ink-2); }
  .item.scan .ic { background: var(--red); }
  .item.reg .ic { background: var(--steel); }
  .stats { margin-top: 24px; background: rgba(255,255,255,0.06); border: 2px dashed #687899; color: #d9dfec; border-radius: 12px; padding: 14px 20px;
    display: flex; gap: 24px; flex-wrap: wrap; font-family: var(--f-mono); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stats b { color: #fff; font-size: 22px; font-family: var(--f-head); }
  .org { margin-top: 36px; display: flex; flex-direction: column; gap: 8px; }
  .org span { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; color: #9aa6c1; text-transform: uppercase; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } .item { flex-direction: row; align-items: center; } .item .ic { flex: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="chip">🏁 Panitia</span>
    <span class="who" id="who"></span>
    <button class="btn ghost small" id="logout">Keluar</button>
  </div>
  <h1>Mau ngapain hari ini, bestie?</h1>
  <p class="sub" id="evName">&nbsp;</p>

  <div class="grid">
    <a class="item dash" href="/admin">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
      <div><b>Dashboard</b><br><span>Lihat peserta, ubah status, export Excel</span></div>
    </a>
    <a class="item scan" href="/scan">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></div>
      <div><b>Scanner</b><br><span>Scan tiket peserta di pintu masuk</span></div>
    </a>
    <a class="item reg" href="/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"/><path d="M9 12h6M9 16h4"/></svg></div>
      <div><b>Pendaftaran</b><br><span>Halaman yang dibuka peserta</span></div>
    </a>
  </div>

  <div class="stats" id="stats"></div>
  <div class="org"><span>Diselenggarakan oleh</span><img class="logos" src="/logos.png" alt="Logo penyelenggara"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
async function init() {
  const me = await fetch("/api/me").then(r => r.json());
  if (!me.user) { location.href = "/admin?next=panitia"; return; }
  $("who").textContent = "Hai, " + me.user + " 👋 semangat jaganya!";
  const ev = await fetch("/api/event").then(r => r.json());
  $("evName").textContent = ev.name;
  document.title = "Panitia · " + ev.name;
  const d = await fetch("/api/participants").then(r => r.json());
  $("stats").innerHTML = `<span>Terdaftar <b>${d.total}</b> / ${d.quota}</span><span>Sudah masuk <b>${d.scanned}</b></span><span>Belum datang <b>${d.total - d.scanned}</b></span>`;
}
$("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/"; });
init();
</script>
</body>
</html>
